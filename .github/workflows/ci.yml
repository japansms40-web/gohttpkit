name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: go mod tidy 无 diff
        run: go mod tidy -diff
      - name: test + 覆盖率门禁（≥90%）
        run: make cover
      - name: race（并发回归）
        run: go test -race -count=1 ./...
      - name: examples 可运行
        run: |
          go run ./examples/customchain
          go run ./examples/fidelity

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m
