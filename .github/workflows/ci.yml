name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: 跨 agent 指令同源（CLAUDE/GEMINI 必须软链到 AGENTS）
        run: make agents-sync-check
      - name: 生产代码错误构造规范
        run: make check-errors
      - name: 测试文件与源文件一一对应
        run: make check-test-layout
      - name: 每个 Go 包有 doc.go 与文件结构树
        run: make check-pkg-doc
      - name: 代码规则（锁 / 事件声明 / panic 位置 / 根 ctx / 辅助函数归位）
        run: make check-style
      - name: AGENTS 共享段与 Cursor 规则 glob
        run: make check-agents-docs
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: go mod tidy 无 diff
        run: go mod tidy -diff
      - name: test + 覆盖率门禁（核心库，目标 ≥98%）
        run: make cover
      - name: race（并发回归）
        run: go test -race -count=1 ./...
      - name: char（对外行为锁定，改链序/发头/解压/状态语义的硬门禁）
        run: make char
      - name: examples 可运行
        run: |
          go run ./examples/customchain
          go run ./examples/fidelity

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: agentguard 自测（vet + test）
        run: make tools-check
      - name: 治理守卫（覆盖率棘轮 / lint 放宽 / char 删改 / 新增 t.Skip）
        env:
          # PR 对比目标分支；push 对比推送前的提交（新分支首推为全零，守卫自动跳过）
          GOVERNANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # PR 标题与正文里的「治理豁免: 理由」/「行为变更」同样生效
          GOVERNANCE_OVERRIDE_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: make governance

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 5m

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck（依赖漏洞门禁）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私有组织仓库需在仓库 secrets 里配 GITLEAKS_LICENSE；个人/公开仓库免费。
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: 提交说明规范（标题 / scope / 测试行 / 会话尾注）
        env:
          # PR 校验 origin/<base_ref>..head（PR 合入过更新的主干时不把主干历史算进来）；push 校验 before..after（全零或 force push 后不在本地的起点，agentguard 自动跳过）
          RANGE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: go run -C tools/agentguard . check-commit-msg --range "$RANGE_BASE..$RANGE_HEAD"
