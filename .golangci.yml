# golangci-lint v2 配置。
# 策略：合入门禁用 make lint-new 只对增量严格（--new-from-rev）；
# 豁免理由必须写注释，禁止无说明的 //nolint。
version: "2"

linters:
  # standard 含 errcheck / govet / staticcheck / unused / ineffassign
  default: standard
  enable:
    - errorlint   # %w 包装与 errors.Is/As 误用
    - copyloopvar # Go 1.22+ 循环变量语义下多余的拷贝
    - gocyclo     # 圈复杂度
    - goconst     # 重复字符串提常量
    - misspell
    - unconvert
    - unparam
    - bodyclose   # resp.Body 关闭检查（bodyDecodeInterceptor 已规范，防新增遗漏）
    - noctx       # HTTP 请求必须带 ctx
    - forbidigo   # 强制 logger 门面，禁止裸打日志
    - gosec
    - revive
    - nolintlint  # //nolint 必须指定 linter 并写理由（CODE_STANDARDS §14）
  settings:
    gocyclo:
      min-complexity: 20
    goconst:
      # header 名、日志字段 key 常只出现 2 次就会漏网；降到 2 卡住新增裸字面量。
      min-occurrences: 2
      min-len: 4
      # 默认 ignore-calls=true 会放过 Header.Get("content-encoding") / slog.String("method", …)
      # 这类正是我们要卡的用法。
      ignore-calls: false
    # 不启用 mnd / revive.add-constant：状态码已由 StatusClass 收敛，但 0o750、退避毫秒、
    # 重试次数等数字遍布生产代码，开魔法数字检测噪音远大于收益。第 9 章 MUST + 评审兜底。
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|log\.(Print|Fatal|Panic)|slog\.(Debug|Info|Warn|Error))'
          msg: "请使用 logger 门面: logger.Info(ctx, msg, attrs...)，ctx 必传"
    nolintlint:
      require-specific: true    # 禁止裸 //nolint 与 //nolint:all
      require-explanation: true # 必须 // 后写理由
      allow-unused: false       # 豁免失效（被豁免的告警已消失）也要删掉
    gosec:
      excludes:
        - G404 # math/rand 弱随机用于指纹域采样，非安全用途
  exclusions:
    rules:
      - path: _test\.go
        linters: [gocyclo, goconst, forbidigo, gosec, noctx, errcheck, revive, bodyclose]
      # 大数据映射表（110+ 国家），复杂度与"重复字符串"告警都无意义：
      # 表里的 "Hans"/"Hant" 就该字面写在每一行，提成常量反而看不出表长什么样
      - path: geo/
        linters: [gocyclo, goconst]
      # error 文案在 nil / 非 nil 两条 Error() 路径各写一次；身份是类型不是文案，
      # min-occurrences=2 会把这些兼容文案误报成「该提常量」
      - path: netproxy/
        linters: [goconst]
      # logger 包自身是门面实现，允许直呼 slog
      - path: logger/
        linters: [forbidigo]
      # examples 是给人读的示范代码，用 fmt 打印结果比走 logger 更直观
      - path: examples/
        linters: [forbidigo, gosec, errcheck, goconst]
      # logger.Format / Output 两个枚举共享字面量 "console"，goconst min-occurrences=2
      # 会把这两条合法定义误报成「该提常量」。字段 key 已收敛到 fields.go。
      - path: logger/
        linters: [goconst]
